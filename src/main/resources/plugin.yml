name: Spleef-OG
main: net.trueog.spleefog.SpleefPlugin
version: ${version}
description: Classic and Bow Spleef in WorldGuard regions.
author: TrueOG
website: https://github.com/true-og/Spleef-OG
api-version: ${apiVersion}
depend: [WorldGuard]
softdepend: [GameModeInventories-OG, PlayerBounties-OG, EternalCombat-OG, BattleTracker, Scoreboard-OG, Spawn-OG]
commands:
  spleef:
    description: Join, spectate, and manage Spleef arenas.
    usage: /spleef help
permissions:
  spleef.play:
    default: true
  spleef.spectate:
    default: true
  spleef.stats:
    default: true
  spleef.admin:
    default: op
  spleef.bypass.teleport:
    description: Teleport out of a Spleef arena while still in a match.
    default: false
  spleef.bypass.commands:
    description: Use blocked commands while in a Spleef arena.
    default: false
