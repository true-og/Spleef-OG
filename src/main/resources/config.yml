# -----------------
# Main configuration for ArenaSpleef
#
# Documentation: https://docs.battleplugins.org/books/additional-gamemodes/chapter/spleef
# Support: https://discord.gg/tMVPVJf
# GitHub: https://github.com/BattlePlugins/ArenaSpleef
# -----------------
config-version: 2.0 # The config version, do not change!

# Worlds where Spleef arenas may be created and where matches may run.
# Leave empty to allow every world. Names are matched case-insensitively.
world-whitelist:
  - world

# WorldGuard regions where Spleef arenas may be created and matches may modify blocks.
# Leave empty to allow any region in an allowed world.
region-whitelist: []

# The tools to use for Spleef.
shovels:
  classic: diamond_shovel{display-name=<yellow>Spleef Shovel}
  bow: bow{display-name=<red><bold>Fire Bow;enchantments=[unbreaking:10,infinity:1,flame:1]}
