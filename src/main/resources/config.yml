# Worlds where Spleef arenas may be created and matches may run.
# Spleef never copies worlds; MyWorlds is only used to ensure managed worlds load first.
world-whitelist:
  - world

match:
  minimum-players: 2
  waiting-seconds: 20
  time-limit-seconds: 300
  victory-seconds: 5

items:
  classic:
    material: DIAMOND_SHOVEL
    name: '&eSpleef Shovel'
  bow:
    material: BOW
    name: '&c&lFire Bow'
    enchantments:
      ARROW_INFINITE: 1
      ARROW_FIRE: 1
      DURABILITY: 10

scoreboard:
  enabled: true
  title: '&b&lSPLEEF'
